[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "football-system"
version = "1.0.0"
description = "Reproducible football analysis with historical settlement and backtesting"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<9",
]

[project.scripts]
football-system = "football_system.interfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"football_system_resources" = ["alembic.ini"]
"football_system_resources/config" = [
    "config/mvp.toml",
    "config/backtest.toml",
    "config/live.toml",
    "config/strategy_profile_v1.json",
    "config/strategy_profile_v2.json",
    "config/poisson_goals_v1.json",
    "config/return_distribution_policy_v1.json",
    "config/return_objective_profile_v1.json",
    "config/prospective_policy_v1.json",
]
"football_system_resources/data/fixtures" = ["data/fixtures/mvp_matches.json", "data/fixtures/strategy_pass_v1.json", "data/fixtures/market_expansion_v1.json", "data/fixtures/legacy_v070_market_goldens.json", "data/fixtures/return_distribution_v1.json", "data/fixtures/prospective_validation_v1.json", "data/fixtures/real_bridge_v1.json"]
"football_system_resources/data/fixtures/historical_acceptance" = [
    "data/fixtures/historical_acceptance/acceptance_config.toml",
    "data/fixtures/historical_acceptance/fixtures.json",
    "data/fixtures/historical_acceptance/manual_quant.json",
    "data/fixtures/historical_acceptance/market_odds.json",
    "data/fixtures/historical_acceptance/match_results.json",
    "data/fixtures/historical_acceptance/provider_mappings.json",
    "data/fixtures/historical_acceptance/sporttery_bonus.json",
]
"football_system_resources/data/fixtures/historical_acceptance/invalid_examples/mapping_conflict" = [
    "data/fixtures/historical_acceptance/invalid_examples/mapping_conflict/provider_mappings.json",
]
"football_system_resources/data/fixtures/historical_acceptance/invalid_examples/mapping_missing" = [
    "data/fixtures/historical_acceptance/invalid_examples/mapping_missing/fixtures.json",
]
"football_system_resources/fankui" = [
    "fankui/architecture.md",
    "fankui/backtest_v1_contract.md",
    "fankui/betting_model.md",
    "fankui/data_model.md",
    "fankui/historical_data_backtest.md",
    "fankui/llm_review_v1_contract.md",
    "fankui/llm_review_v2_contract.md",
    "fankui/llm_review_v3_contract.md",
    "fankui/llm_strategy.md",
    "fankui/strategy_pass_v1_contract.md",
    "fankui/market_taxonomy_v1_contract.md",
    "fankui/poisson_goals_baseline_v1_contract.md",
    "fankui/analysis_packet_v4_contract.md",
    "fankui/strategy_pass_v2_contract.md",
    "fankui/return_distribution_v1_contract.md",
    "fankui/prospective_validation_v1_contract.md",
]
"football_system_resources/fankui/decisions" = [
    "fankui/decisions/0001-market-abstraction.md",
    "fankui/decisions/0002-versioned-fusion-policies.md",
    "fankui/decisions/0003-ticket-and-atomic-bet.md",
    "fankui/decisions/0004-frozen-evidence-for-llm.md",
    "fankui/decisions/0005-sporttery-stake-unit.md",
