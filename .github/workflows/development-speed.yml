name: Development Speed Benchmark V1

on:
  push:
    branches: [feature/ci-development-speed-v1]
    paths:
      - devtools/**
      - tests/support/**
      - tests/integration/test_training_admission_persistence.py
      - tests/e2e/test_production_quant_cli.py
      - .github/workflows/development-speed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parallel-benchmark:
    name: Speed experiment (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: n2-load
            workers: '2'
            scheduler: load
          - label: capacity-load
            workers: capacity
            scheduler: load
          - label: capacity-worksteal
            workers: capacity
            scheduler: worksteal
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install measured environment
        run: python -m pip install -e ".[test]" -r config/openfootball_snapshot_requirements.txt -r devtools/requirements.txt -c devtools/benchmark-constraints.txt
      - name: Preserve required CI and release inputs
        run: python devtools/safety.py
      - name: Measure unchanged full test collection
        run: >-
          python devtools/measure.py
          --output "${{ runner.temp }}/speed-${{ matrix.label }}"
          --temp-root "${{ runner.temp }}"
          --workers "${{ matrix.workers }}"
          --dist "${{ matrix.scheduler }}"
          --expected-count 3149
          --timeout 18000
          tests
      - name: Retain benchmark evidence including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-${{ matrix.label }}-${{ github.sha }}
          path: ${{ runner.temp }}/speed-${{ matrix.label }}/
          if-no-files-found: error
          retention-days: 30

  isolation-review:
    name: Speed tools and randomized isolation
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.15'
      - name: Install same measured environment
        run: python -m pip install -e ".[test]" -r config/openfootball_snapshot_requirements.txt -r devtools/requirements.txt -c devtools/benchmark-constraints.txt
      - name: Lint development patch
        run: python -m ruff check .
      - name: Randomized SQLite, temporary-file and cross-process isolation
        shell: bash
        run: |
          for seed in 137 271; do
            python devtools/measure.py \
              --output "$RUNNER_TEMP/isolation-$seed" \
              --temp-root "$RUNNER_TEMP" --workers 2 --dist worksteal --seed "$seed" \
              devtools/tests tests/integration/test_database_schema.py \
              tests/integration/test_sqlite_checkout_lifecycle.py \
              tests/integration/test_portfolio_processes.py \
              tests/integration/test_migration_url_encoding.py
          done
      - name: Retain isolation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speed-isolation-${{ github.sha }}
          path: ${{ runner.temp }}/isolation-*/
          if-no-files-found: error
          retention-days: 30
