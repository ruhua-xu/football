[runtime]
environment = "live"
kickoff_tolerance_seconds = 300

[database]
url = "sqlite:///data/live/football.db"

[backtest]
version = "BACKTEST_V1"
data_mode = "LIVE_STRICT"
log_loss_epsilon = "0.000001"

[backtest.slates]
policy = "DAILY_FIXED_CUTOFF_V1"

[settlement]
policy = "THREE_WAY_2X1_BACKTEST_V1"
