[database]
url = "sqlite:///data/football_mvp.db"

[analysis]
pipeline_version = "PORTFOLIO_RISK_V2"
fusion_policy = "QUANT_ONLY_V1"
quant_weight = "0.70"
min_selection_ev = "0.02"
min_ticket_roi = "0.02"

[portfolio]
preferred_max_tickets = 4
absolute_max_tickets = 8
extra_ticket_min_roi = "0.20"
operational_complexity_penalty = "0.01"
max_match_exposure_ratio = "0.60"
max_selection_exposure_ratio = "0.60"
concentration_penalty = "0.10"
min_marginal_score = "0.10"

[review_fusion]
policy = "LLM_REVIEW_DELTA_V1"
version = "1"
max_probability_delta = "0.08"
legacy_data_quality_factor = "0.25"

[sporttery]
rules_version = "SPORTTERY_MVP_V1"
base_stake_fen = 200
max_multiplier = 50
max_ticket_stake_fen = 600000

[mock]
fixture_path = "data/fixtures/mvp_matches.json"

[backtest]
version = "BACKTEST_V1"
data_mode = "LIVE_STRICT"
log_loss_epsilon = "0.000001"

[backtest.slates]
policy = "DAILY_FIXED_CUTOFF_V1"

[settlement]
policy = "THREE_WAY_2X1_BACKTEST_V1"
